name: Build MagicSMP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: guard/pom.xml

      - name: Verify project files
        run: |
          echo "Checking MagicSMP project..."
          test -f baseline/MagicSMP.jar || {
            echo "ERROR: baseline/MagicSMP.jar is missing"
            exit 1
          }

          test -f guard/pom.xml || {
            echo "ERROR: guard/pom.xml is missing"
            exit 1
          }

          test -f build.sh || {
            echo "ERROR: build.sh is missing"
            exit 1
          }

          echo "All required files found."
          ls -lh baseline/MagicSMP.jar

      - name: Install current MagicSMP
        run: |
          mvn install:install-file \
            -Dfile=baseline/MagicSMP.jar \
            -DgroupId=com.bx \
            -DartifactId=magicsmp-current \
            -Dversion=1.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build Sell GUI Protection
        working-directory: guard
        run: mvn -B clean package

      - name: Build final MagicSMP
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify final JAR
        run: |
          if [ ! -f build/MagicSMP.jar ]; then
            echo "ERROR: build/MagicSMP.jar was not created."
            exit 1
          fi

          echo "MagicSMP successfully built:"
          ls -lh build/MagicSMP.jar

      - name: Upload MagicSMP
        uses: actions/upload-artifact@v4
        with:
          name: MagicSMP
          path: build/MagicSMP.jar
          if-no-files-found: error
          retention-days: 30
